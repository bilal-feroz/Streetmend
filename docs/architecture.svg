<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7aa2ff"/>
    </marker>
    <style>
      .t{fill:#e8ecf4;font-size:15px;font-weight:600}
      .s{fill:#a6b0c6;font-size:12px}
      .h{fill:#7581a0;font-size:11px;font-weight:700;letter-spacing:.12em}
      .b{fill:#121a2d;stroke:#2b3858;stroke-width:1.2}
      .k{fill:#0f1a33;stroke:#5b8cff;stroke-width:1.6}
      .g{fill:#0f2b25;stroke:#34d399;stroke-width:1.4}
      .w{fill:#2b2410;stroke:#fbbf24;stroke-width:1.2}
      .r{fill:#2b1416;stroke:#f87171;stroke-width:1.2}
      .l{stroke:#7aa2ff;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .d{stroke:#566282;stroke-width:1.3;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1240" height="800" rx="16" fill="#080c16"/>
  <text x="40" y="48" fill="#e8ecf4" font-size="22" font-weight="700" letter-spacing=".14em">STREETMEND · ARCHITECTURE</text>
  <text x="40" y="72" class="s">One pedestrian graph and one usability rule feed every engine. The language model only selects allowlisted operations; the graph code computes every result.</text>

  <text x="40" y="112" class="h">SOURCES</text>
  <text x="290" y="112" class="h">INGESTION</text>
  <text x="520" y="112" class="h">ONE GRAPH</text>
  <text x="760" y="112" class="h">ENGINES</text>
  <text x="1030" y="112" class="h">INTERFACES</text>

  <!-- sources -->
  <rect class="b" x="40" y="128" width="210" height="58" rx="10"/>
  <text class="t" x="56" y="152">CDOT ADA Curb Ramps</text><text class="s" x="56" y="172">ArcGIS REST · 320 in area</text>
  <rect class="b" x="40" y="196" width="210" height="58" rx="10"/>
  <text class="t" x="56" y="220">CDOT Sidewalk Inventory</text><text class="s" x="56" y="240">per side · "No Sidewalk" gaps</text>
  <rect class="b" x="40" y="264" width="210" height="58" rx="10"/>
  <text class="t" x="56" y="288">CATS Bus Stops</text><text class="s" x="56" y="308">City of Charlotte</text>
  <rect class="b" x="40" y="332" width="210" height="74" rx="10"/>
  <text class="t" x="56" y="356">OpenStreetMap</text><text class="s" x="56" y="376">streets · 285 facilities in 6</text><text class="s" x="56" y="392">categories · 5,113 buildings</text>
  <rect class="w" x="40" y="416" width="210" height="58" rx="10"/>
  <text class="t" x="56" y="440">Scenario specs</text><text class="s" x="56" y="460">hypothetical settings, labeled</text>

  <!-- ingestion -->
  <rect class="b" x="290" y="128" width="200" height="278" rx="10"/>
  <text class="t" x="306" y="152">scripts/ingest</text>
  <text class="s" x="306" y="176">• paginated ArcGIS + retries</text>
  <text class="s" x="306" y="196">• pyproj 2264 → 4326</text>
  <text class="s" x="306" y="216">• Overpass: facilities,</text>
  <text class="s" x="306" y="232">   buildings, canopy</text>
  <text class="s" x="306" y="252">• provenance + retrieval time</text>
  <text class="s" x="306" y="272">• dedupe, quality stats</text>
  <text class="s" x="306" y="300">→ data/samples (committed:</text>
  <text class="s" x="306" y="316">   engine runs offline)</text>
  <text class="s" x="306" y="344">municipal/build.py</text>
  <text class="s" x="306" y="364">corners · ramps · crossings</text>
  <text class="s" x="306" y="380">no record → UNKNOWN</text>

  <!-- graph -->
  <rect class="k" x="520" y="128" width="210" height="150" rx="10"/>
  <text class="t" x="536" y="152">PedGraph</text>
  <text class="s" x="536" y="174">sidewalk · crossing · ramp</text>
  <text class="s" x="536" y="192">traversable / blocked / unknown</text>
  <text class="s" x="536" y="210">+ evidence on every edge</text>
  <text class="s" x="536" y="236">usable(edge, profile, policy)</text>
  <text class="s" x="536" y="254">step-free · walking</text>
  <text class="s" x="536" y="270">verified · possible · physical</text>
  <rect class="b" x="520" y="292" width="210" height="114" rx="10"/>
  <text class="t" x="536" y="316">Intervention model</text>
  <text class="s" x="536" y="338">typed ops · targets · state</text>
  <text class="s" x="536" y="354">change · preconditions · profiles</text>
  <text class="s" x="536" y="370">cost · dependencies · provenance</text>
  <text class="s" x="536" y="388">record-backed or simulated</text>

  <!-- engines -->
  <rect class="g" x="760" y="128" width="240" height="132" rx="10"/>
  <text class="t" x="776" y="152">verify: change check</text>
  <text class="s" x="776" y="174">baseline → proposed → fixed</text>
  <text class="s" x="776" y="192">checks PASS / FAIL / INCONCLUSIVE</text>
  <text class="s" x="776" y="210">counterexample per regression</text>
  <text class="s" x="776" y="228">minimal fix: exact by size,</text>
  <text class="s" x="776" y="244">budget + dependencies, re-verified</text>
  <rect class="g" x="760" y="270" width="240" height="132" rx="10"/>
  <text class="t" x="776" y="294">access: gaps → fix or build</text>
  <text class="s" x="776" y="316">951 homes · multi-source Dijkstra</text>
  <text class="s" x="776" y="334">diagnosis: barrier / detour /</text>
  <text class="s" x="776" y="350">no facility / unknown · E2SFCA supply</text>
  <text class="s" x="776" y="368">repairs (ellipse-pruned exact)</text>
  <text class="s" x="776" y="384">vs hypothetical site · re-verified</text>
  <rect class="b" x="760" y="412" width="240" height="62" rx="10"/>
  <text class="t" x="776" y="436">optimize: repair planner</text>
  <text class="s" x="776" y="456">exact · greedy · individual · beam</text>
  <rect class="b" x="760" y="484" width="240" height="62" rx="10"/>
  <text class="t" x="776" y="508">evaluation</text>
  <text class="s" x="776" y="528">10 fixtures · greedy · nearest-first</text>

  <!-- interfaces -->
  <rect class="b" x="1030" y="128" width="170" height="92" rx="10"/>
  <text class="t" x="1046" y="152">FastAPI</text>
  <text class="s" x="1046" y="174">verify · verify/fix</text>
  <text class="s" x="1046" y="190">access · compare</text>
  <text class="s" x="1046" y="206">assistant · evaluation</text>
  <rect class="k" x="1030" y="232" width="170" height="134" rx="10"/>
  <text class="t" x="1046" y="256">Web app</text>
  <text class="s" x="1046" y="278">React · MapLibre ·</text>
  <text class="s" x="1046" y="294">three.js 3D city</text>
  <text class="s" x="1046" y="316">Change check</text>
  <text class="s" x="1046" y="332">Access gaps</text>
  <text class="s" x="1046" y="348">Planner · Explorer</text>
  <rect class="r" x="1030" y="378" width="170" height="114" rx="10"/>
  <text class="t" x="1046" y="402">Assistant</text>
  <text class="s" x="1046" y="424">rules → local Qwen</text>
  <text class="s" x="1046" y="440">→ 18 allowlisted ops</text>
  <text class="s" x="1046" y="456">→ graph tools</text>
  <text class="s" x="1046" y="476">no exec, no SQL</text>

  <!-- arrows -->
  <path class="l" d="M250 157 H290"/>
  <path class="l" d="M250 225 H290"/>
  <path class="l" d="M250 293 H290"/>
  <path class="l" d="M250 369 H290"/>
  <path class="l" d="M490 203 H520"/>
  <path class="d" d="M250 445 C 400 445, 470 430, 520 380"/>
  <path class="l" d="M730 190 H760"/>
  <path class="l" d="M730 250 C 745 260, 745 300, 760 320"/>
  <path class="l" d="M730 350 C 745 330, 745 220, 760 220"/>
  <path class="l" d="M730 380 C 745 400, 745 440, 760 443"/>
  <path class="l" d="M1000 175 H1030"/>
  <path class="l" d="M1000 330 C 1015 300, 1015 200, 1030 200"/>
  <path class="l" d="M1115 220 V232"/>
  <path class="d" d="M1115 378 V366"/>

  <!-- principles -->
  <rect class="b" x="40" y="580" width="1160" height="186" rx="12"/>
  <text x="60" y="608" class="h">PRINCIPLES</text>
  <text class="s" x="60" y="634">1. The baseline is never mutated. Typed changes build separate proposed and fixed states; repairs and new facilities are recomputed, never painted on.</text>
  <text class="s" x="60" y="658">2. Unknown never becomes PASS. Every check and every home is evaluated with unknown links excluded and included: PASS / INCONCLUSIVE / FAIL.</text>
  <text class="s" x="60" y="682">3. Nothing is fixed until the graph says so. Each mitigation, repair set or facility site is re-verified on the recomputed network; minimality is checked by removing each member.</text>
  <text class="s" x="60" y="706">4. One usability rule. Access analysis and change checks read the same edges through the same function (verify.profiles.usable), so their answers cannot disagree.</text>
  <text class="s" x="60" y="730">5. Real records stay labeled real; scenario settings, hypothetical sites and proxies (homes are buildings, not people) are labeled where they are shown.</text>
  <text class="s" x="60" y="754">6. The language model chooses an operation; it never computes a number, edits the graph, runs code or queries a database.</text>
</svg>
