[project]
name = "streetmend"
version = "0.1.0"
description = "StreetMend: combination-aware pedestrian accessibility repair planning engine and API"
authors = [{ name = "Bilal Feroz" }]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "networkx>=3.3",
    "numpy>=2.0",
    "scipy>=1.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
ingest = ["osmnx>=2.0", "geopandas>=1.0"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-timeout>=2.3"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
